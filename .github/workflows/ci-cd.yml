name: ENGRAVIA LABS — CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/engravia

jobs:
  # ─── Lint & Type Check ──────────────────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [backend, frontend, admin]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '${{ matrix.app }}/package-lock.json'
      - name: Install
        run: cd ${{ matrix.app }} && npm ci
      - name: Type check
        run: cd ${{ matrix.app }} && npx tsc --noEmit
      - name: Lint
        run: cd ${{ matrix.app }} && npm run lint --if-present

  # ─── Build & Push Docker Images ─────────────────────────────────────────────
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: lint
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [backend, frontend, admin]
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push ${{ matrix.app }}
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.app }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.app }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.app }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Deploy to Production ────────────────────────────────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            set -e
            echo "=== Pulling latest images ==="
            cd /var/www/engravia
            
            # Login to GHCR
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Pull new images
            docker compose pull backend frontend admin
            
            # Zero-downtime rolling restart
            echo "=== Restarting services ==="
            docker compose up -d --no-deps backend
            sleep 10
            docker compose up -d --no-deps frontend
            docker compose up -d --no-deps admin
            docker compose up -d nginx
            
            # Cleanup old images
            docker image prune -f
            
            echo "=== Deployment complete ==="
            docker compose ps

  # ─── Health Check After Deploy ───────────────────────────────────────────────
  health-check:
    name: Post-deploy Health Check
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Check API health
        run: |
          sleep 20
          status=$(curl -s -o /dev/null -w "%{http_code}" https://api.engravialabs.com/health)
          if [ "$status" != "200" ]; then
            echo "Health check failed: HTTP $status"
            exit 1
          fi
          echo "API healthy: HTTP $status"
      - name: Check storefront
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" https://engravialabs.com)
          if [ "$status" != "200" ]; then
            echo "Storefront check failed: HTTP $status"
            exit 1
          fi
          echo "Storefront healthy: HTTP $status"
